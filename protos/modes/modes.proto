syntax = "proto3";

package mavsdk.rpc.modes;

option java_package = "io.mavsdk.modes";
option java_outer_classname = "ModesProto";

/*
 * Discover and set flight modes at runtime.
 *
 * The modes are queried from the vehicle using the MAVLink standard modes
 * protocol (AVAILABLE_MODES, CURRENT_MODE). For autopilots that don't
 * implement it, a list of known modes is used as a fallback.
 *
 * Modes are identified by name. Standard modes have a fixed name, e.g.
 * "Position" or "Mission", custom modes use the name reported by the vehicle.
 */
service ModesService {
    /*
     * Subscribe to the list of available modes.
     *
     * The list is updated whenever the vehicle reports that its modes have changed.
     */
    rpc SubscribeAvailableModes(SubscribeAvailableModesRequest) returns(stream AvailableModesResponse) {}
    /*
     * Subscribe to the current mode.
     */
    rpc SubscribeCurrentMode(SubscribeCurrentModeRequest) returns(stream CurrentModeResponse) {}
    /*
     * Set mode by name.
     *
     * The name needs to match exactly (case-sensitive) the name of one of the available modes.
     */
    rpc SetMode(SetModeRequest) returns(SetModeResponse) {}
    /*
     * Set a standard mode.
     */
    rpc SetStandardMode(SetStandardModeRequest) returns(SetStandardModeResponse) {}
}

message SubscribeAvailableModesRequest {}
message AvailableModesResponse {
    repeated Mode modes = 1; // The available modes
}

message SubscribeCurrentModeRequest {}
message CurrentModeResponse {
    Mode mode = 1; // The current mode
}

message SetModeRequest {
    string name = 1; // Name of the mode to set
}
message SetModeResponse {
    ModesResult modes_result = 1;
}

message SetStandardModeRequest {
    StandardMode standard_mode = 1; // Standard mode to set
}
message SetStandardModeResponse {
    ModesResult modes_result = 1;
}

/*
 * Standard mode.
 *
 * See https://mavlink.io/en/messages/common.html#MAV_STANDARD_MODE
 */
enum StandardMode {
    STANDARD_MODE_NON_STANDARD = 0; // Non-standard mode, specific to the autopilot
    STANDARD_MODE_POSITION_HOLD = 1; // Position hold, named "Position"
    STANDARD_MODE_ORBIT = 2; // Orbit, named "Orbit"
    STANDARD_MODE_CRUISE = 3; // Cruise, named "Cruise"
    STANDARD_MODE_ALTITUDE_HOLD = 4; // Altitude hold, named "Altitude"
    STANDARD_MODE_SAFE_RECOVERY = 5; // Safe recovery such as return to launch, named "Safe Recovery"
    STANDARD_MODE_MISSION = 6; // Mission, named "Mission"
    STANDARD_MODE_LAND = 7; // Land, named "Land"
    STANDARD_MODE_TAKEOFF = 8; // Takeoff, named "Takeoff"
}

// Mode type.
message Mode {
    string name = 1; // Name of the mode, e.g. "Position" or "Stabilize"
    StandardMode standard_mode = 2; // Standard mode, or non-standard for custom modes
    uint32 custom_mode = 3; // Autopilot specific custom mode
    bool is_user_selectable = 4; // True if the mode can be set by the user
    bool is_advanced = 5; // True if the mode is for advanced users only
    bool is_auto_mode = 6; // True if the mode runs autonomously, e.g. Mission or Land
}

// Result type.
message ModesResult {
    // Possible results returned for mode requests.
    enum Result {
        RESULT_UNKNOWN = 0; // Unknown result
        RESULT_SUCCESS = 1; // Request was successful
        RESULT_NO_SYSTEM = 2; // No system is connected
        RESULT_CONNECTION_ERROR = 3; // Connection error
        RESULT_BUSY = 4; // Vehicle is busy
        RESULT_DENIED = 5; // Request was denied, e.g. because the mode can't be entered right now
        RESULT_UNSUPPORTED = 6; // Mode or command is not supported
        RESULT_TIMEOUT = 7; // Request timed out
        RESULT_FAILED = 8; // Request failed
        RESULT_MODE_NOT_FOUND = 9; // No available mode with this name
        RESULT_MODES_NOT_KNOWN_YET = 10; // The available modes have not been received yet
    }

    Result result = 1; // Result enum value
    string result_str = 2; // Human-readable English string describing the result
}
